name: Sync

on:
  push:
    branches:
      - main
    paths:
      - '.github/sync.yml'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitconfig'
      - '.prettierrc.json'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'files/**'
      - 'templates/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.GH_PAT }}
          ASSIGNEES: hu553in
          COMMIT_PREFIX: 'chore(sync):'
