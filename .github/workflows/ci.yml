name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag checkout for the release notes smoke test
        run: git tag v0.0.0-ci
      - id: release-notes
        uses: ./.github/actions/release-notes
      - env:
          RELEASE_NOTES: ${{ steps.release-notes.outputs.changelog }}
        run: grep --fixed-strings --quiet '## [0.0.0-ci](' "$RELEASE_NOTES"
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: ./.github/actions/setup-shfmt
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make check
