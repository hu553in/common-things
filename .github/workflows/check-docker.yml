name: Check Docker image

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: .
      file:
        required: false
        type: string
        default: Dockerfile
      build_args:
        required: false
        type: string
        default: ''
      no_cache_filters:
        required: false
        type: string
        default: ''
      build:
        required: false
        type: boolean
        default: true
      build_default_branch:
        required: false
        type: boolean
        default: false
      smoke_command:
        required: false
        type: string
        default: ''
      runs_on:
        required: false
        type: string
        default: ubuntu-latest

jobs:
  check:
    runs-on: ${{ inputs.runs_on }}
    permissions:
      contents: read
    env:
      BUILD_IMAGE:
        ${{ inputs.build && github.ref_type != 'tag' && (inputs.build_default_branch || github.ref
        != format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ inputs.file }}
          failure-threshold: warning
          ignore: DL3008
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          call: check
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          build-args: ${{ inputs.build_args }}
      - if: env.BUILD_IMAGE == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          build-args: ${{ inputs.build_args }}
          load: true
          tags: local/docker-check:${{ github.sha }}
          pull: true
          no-cache-filters: ${{ inputs.no_cache_filters }}
          cache-from: type=gha,scope=${{ inputs.file }}
          cache-to: type=gha,scope=${{ inputs.file }},mode=max
      - if: env.BUILD_IMAGE == 'true'
        uses: hu553in/common-things/.github/actions/verify-docker@main
        with:
          image-ref: local/docker-check:${{ github.sha }}
          smoke-command: ${{ inputs.smoke_command }}
