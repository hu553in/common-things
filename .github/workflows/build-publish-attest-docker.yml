name: Build, publish, and attest Docker image

on:
  workflow_call:
    inputs:
      image:
        required: true
        type: string
      context:
        required: false
        type: string
        default: .
      file:
        required: false
        type: string
        default: Dockerfile
      build_args:
        required: false
        type: string
        default: ''
      no_cache_filters:
        required: false
        type: string
        default: ''
      smoke_command:
        required: false
        type: string
        default: ''
      runs_on:
        required: false
        type: string
        default: ubuntu-latest
    outputs:
      digest:
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-publish-docker.yml
    with:
      image: ${{ inputs.image }}
      context: ${{ inputs.context }}
      file: ${{ inputs.file }}
      build_args: ${{ inputs.build_args }}
      no_cache_filters: ${{ inputs.no_cache_filters }}
      smoke_command: ${{ inputs.smoke_command }}
      runs_on: ${{ inputs.runs_on }}

  attest:
    needs: publish
    permissions:
      attestations: write
      id-token: write
      packages: write
    uses: ./.github/workflows/attest-docker.yml
    with:
      image: ${{ inputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
