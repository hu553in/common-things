name: Verify Docker image
description: Smoke-test an image, free build cache, and run the blocking scan

inputs:
  image-ref:
    description: Docker image tag or digest to verify
    required: true
  smoke-command:
    description: Shell command to run inside the image without network access
    required: false
    default: ''
  smoke-seccomp-profile:
    description: Optional relative path to a seccomp profile in the caller checkout
    required: false
    default: ''

runs:
  using: composite
  steps:
    - if: inputs.smoke-command != ''
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
        SMOKE_COMMAND: ${{ inputs.smoke-command }}
        SMOKE_SECCOMP_PROFILE: ${{ inputs.smoke-seccomp-profile }}
      run: |
        options=(--rm --network none)
        if [[ -n "$SMOKE_SECCOMP_PROFILE" ]]; then
          options+=(--security-opt "seccomp=./$SMOKE_SECCOMP_PROFILE")
        fi
        docker run "${options[@]}" \
          --entrypoint /bin/sh \
          "$IMAGE_REF" \
          -ec "$SMOKE_COMMAND"
    - shell: bash
      run: docker buildx prune --all --force
    - uses: hu553in/common-things/.github/actions/scan-docker@main
      with:
        image-ref: ${{ inputs.image-ref }}
